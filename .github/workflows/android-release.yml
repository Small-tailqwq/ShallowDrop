name: Android release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Build release APK
        working-directory: android
        run: bash gradlew :app:assembleRelease

      - name: Sign and verify APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          keystore="$RUNNER_TEMP/shallowdrop-release.p12"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          tools="$ANDROID_HOME/build-tools/37.0.0"
          metadata=android/app/build/outputs/apk/release/output-metadata.json
          version=$(jq -r '.elements[0].versionName' "$metadata")
          input="android/app/build/outputs/apk/release/$(jq -r '.elements[0].outputFile' "$metadata")"
          mkdir -p release
          apk="release/ShallowDrop-$version.apk"
          "$tools/zipalign" -c -P 16 4 "$input"
          "$tools/apksigner" sign --ks "$keystore" --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$apk" "$input"
          "$tools/apksigner" verify --verbose --print-certs "$apk" | tee release/signature.txt
          expected=$(openssl x509 -in android/signing/release-cert.pem -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr '[:upper:]' '[:lower:]')
          actual=$(sed -n 's/^.*certificate SHA-256 digest: //p' release/signature.txt | sort -u)
          test "$actual" = "$expected"
          cp android/signing/release-cert.pem release/ShallowDrop-release-cert.pem
          printf '%s\n' "$GITHUB_SHA" > release/source-commit.txt
          cd release
          sha256sum "ShallowDrop-$version.apk" > SHA256SUMS

      - name: Upload signed release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-release
          path: |
            release/*.apk
            release/SHA256SUMS
            release/ShallowDrop-release-cert.pem
            release/signature.txt
            release/source-commit.txt
          if-no-files-found: error
